title: Recommend story-map slice ordering and delivery strategy
status: implemented
summary: Add explicit guidance and machine-readable recommendations for ordering
  story-map slices so teams deliver coherent end-to-end value earlier.
intent: Help teams move from static map structure to actionable release strategy
  by recommending walking-skeleton-first ordering, then progressive capability
  layers tied to outcomes and risk.
acceptance:
  - CapabilityKit can derive a recommended slice order from story-map metadata
    that starts with a walking-skeleton candidate across mapped backbone
    activities.
  - Recommendations can distinguish release strategy from development strategy,
    including opening, mid-game, and end-game delivery phases.
  - Recommendations include risk and learning intent per slice so teams can
    prioritize outcomes instead of isolated features.
  - Teams can request ordering recommendations for a selected release and
    receive rationale that references backbone and step coverage gaps.
  - Ordering recommendations remain additive and do not mutate existing
    capability identity or required status workflows.
guidance:
  - Prefer thin horizontal slices that span the narrative left-to-right flow
    before deepening any single step.
  - Treat ordering recommendations as provisional until slice coherence can be
    validated by dedicated outcome-completeness checks.
  - Encourage naming each slice by user and business outcome to support roadmap
    communication.
planning:
  story_map:
    backbone: Story mapping
    step: Plan release slices
    release: story-mapping
    order: 20
