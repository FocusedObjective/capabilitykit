  # validate saved agent output without writing: capabilitykit review-result product-planning/story-mapping/validate-story-map-slice-coherence-and-outcome-completeness --input review.json
  # -----------------------------
  depends_on:
    - product-planning/story-mapping/recommend-story-map-slice-order-and-delivery-strategy
    - product-planning/story-mapping/strengthen-story-map-presentation-and-readability
  verification:
    gaps:
      - Slice coherence validation needs an explicit outcome model or
        conservative deterministic rules before implementation starts.
