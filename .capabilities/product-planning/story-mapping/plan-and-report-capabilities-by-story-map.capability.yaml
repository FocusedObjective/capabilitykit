title: Plan and report capabilities by story map
status: planned
summary: Provide planning workflows and reports that group capabilities into story-map backbones, steps, and release slices such as MVP and V2.
intent: Help teams collaboratively plan capabilities as a story map and inspect implementation progress by release slice without reorganizing capability paths.
acceptance:
  - Teams can query capability status grouped by story-map release slice.
  - Teams can view capabilities grouped by story-map backbone and step.
  - Reports include planned and implemented capabilities so roadmap conversations stay connected to delivery status.
  - Story-map reporting works for mixed datasets where some capabilities do not yet define planning metadata.
guidance:
  - Prefer additive CLI/report features over breaking existing status output.
  - Support filtering by release values like mvp, v2, and v3.
  - Keep output deterministic so diffs are reviewable in CI.
agent:
  inputs:
    - packages/cli/**
    - .capabilities/**/*.capability.yaml
  outputs:
    - CLI/report command updates for story-map grouping and filtering
  dependencies:
    - product-planning/story-mapping/model-capability-story-map-metadata
  implementation:
    references: []
    inferred_from: []
  verification:
    automated:
      - id: cli-story-map-report-tests
        description: CLI tests cover story-map grouping and release filtering.
        command: npm test
    manual:
      - Run capabilitykit status style command with story-map grouping and verify output on sample capabilities.
    gaps: []
    ignore_gaps: []
