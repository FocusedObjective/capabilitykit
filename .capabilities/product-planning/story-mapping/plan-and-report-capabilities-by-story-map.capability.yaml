title: Plan and report capabilities by story map
status: implemented
summary: Provide planning workflows and reports that group capabilities into
  story-map backbones, steps, and release slices such as MVP and V2.
intent: Help teams collaboratively plan capabilities as a story map and inspect
  implementation progress by release slice without reorganizing capability
  paths.
acceptance:
  - Teams can query capability status grouped by story-map release slice.
  - Teams can view capabilities grouped by story-map backbone and step.
  - Reports include planned and implemented capabilities so roadmap
    conversations stay connected to delivery status.
  - Story-map reporting works for mixed datasets where some capabilities do not
    yet define planning metadata.
  - Teams can generate a dedicated, self-contained HTML story-map viewer with
    release tabs, search, health filtering, grouped cards, unassigned
    capabilities, and capability detail dialogs.
guidance:
  - Prefer additive CLI/report features over breaking existing status output.
  - Support filtering by project release slices like mvp, website,
    story-mapping, and reverse-engineering.
  - Keep output deterministic so diffs are reviewable in CI.
planning:
  story_map:
    backbone: Story mapping
    step: Plan release slices
    release: story-mapping
    order: 20
