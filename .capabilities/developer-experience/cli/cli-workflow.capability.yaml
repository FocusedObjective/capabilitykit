title: CLI workflow
status: implemented
summary: Provide CLI commands for init, create, validate, compile, and inspect.
intent: Make capability management fast enough to stay close to normal
  development workflows.
acceptance:
  - Supports init, create, status, diff, validate, compile, and inspect commands.
  - Supports a graph command that compiles dependency updates and writes an
    animated, draggable SVG dependency graph to
    `.capabilities/dependency-graph.svg` by default.
  - Returns a non-zero exit code for validation failures.
  - Prints verification gaps in validation and inspect output.
guidance:
  - Keep command output concise and script-friendly.
  - Do not hide verification gaps behind verbose flags.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review developer-experience/cli/cli-workflow
  # run deterministic review only: capabilitykit review developer-experience/cli/cli-workflow --deterministic-only
  # ask an agent and save review evidence: capabilitykit review developer-experience/cli/cli-workflow --agent codex --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result developer-experience/cli/cli-workflow --input review.json
  # -----------------------------
  depends_on:
    - core/project/initialize-capability-project
    - core/validation/validate-capability-files
    - core/graph/compile-capabilities
    - core/graph/generate-dependency-graph-svg
  implementation:
    references:
      - packages/cli/src/index.ts
  verification:
    automated:
      - id: cli-build
        description: TypeScript build verifies CLI entrypoint imports.
        command: npm run build
    manual:
      - Run each CLI command against the dogfooded capability map before release.
