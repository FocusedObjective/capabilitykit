title: Install CapabilityKit skill
status: implemented
summary: Initialize CapabilityKit skill files and agent entrypoints that point
  agents to the package skill guide.
intent: Make CapabilityKit review and editing workflows reusable across coding
  agents without copying long instructions into every project file.
acceptance:
  - Provides `capabilitykit skill` to install CapabilityKit skill files and
    agent entrypoints.
  - Points generated guidance back to the package SKILL.md file.
  - Preserves existing AGENTS.md and CLAUDE.md content while replacing any prior
    CapabilityKit managed block.
  - Creates Codex skill and Claude slash-command wrapper files for simple
    prompts.
  - Tells agents to draft new capability files from human-authored product
    intent first instead of inventing agent metadata.
  - Explains how agents should author `planning.story_map` metadata for release
    slices, backbones, steps, and delivery order.
  - Summarizes implemented CapabilityKit workflows for initialization,
    formatting, reporting, viewers, diffing, impact analysis, external agent
    handoff, and review evidence.
  - Covers merge behavior with automated tests.
guidance:
  - Keep managed blocks short and bounded by stable markers.
  - Prefer referencing the package skill guide over duplicating the full guide
    into project files.
  - Keep creation guidance explicit that generated review and implementation
    metadata comes from CapabilityKit commands, not from prompt-time guesses.
  - Keep story-map guidance focused on product intent, progressive delivery, and
    verification workflow instead of repository structure.
  - Keep the package skill guide aligned with implemented CLI commands and
    capability schema fields so coding agents do not rely on stale workflow
    assumptions.
  - Do not overwrite user-authored agent instructions outside the managed
    CapabilityKit block.
planning:
  story_map:
    backbone: Agent workflow
    step: Delegate implementation review
    release: mvp
    order: 80
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review developer-experience/skills/install-capabilitykit-skill
  # run deterministic review only: capabilitykit review developer-experience/skills/install-capabilitykit-skill --deterministic-only
  # ask an agent and save review evidence: capabilitykit review developer-experience/skills/install-capabilitykit-skill --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result developer-experience/skills/install-capabilitykit-skill --input review.json
  # -----------------------------
  inputs:
    - terminal command
    - existing AGENTS.md or CLAUDE.md files
    - package skill guide path
  outputs:
    - AGENTS.md managed CapabilityKit block
    - CLAUDE.md managed CapabilityKit block
    - .codex/skills/capabilitykit/SKILL.md wrapper
    - .claude/commands/capabilitykit.md slash command
  depends_on:
    - developer-experience/cli/cli-workflow
  implementation:
    references:
      - packages/cli/SKILL.md
      - packages/cli/src/skillInstall.ts
      - packages/cli/src/index.ts
      - packages/cli/tests/skillInstall.test.ts
  verification:
    automated:
      - id: skill-install-tests
        description: Unit tests cover managed block append and replacement behavior.
        command: npm test
      - id: cli-build
        description: TypeScript build verifies the installer command and helper imports.
        command: npm run build
    manual:
      - Run capabilitykit skill in a sample project and confirm the generated
        files reference the package SKILL.md.
  review:
    depth: verified
    source: coding-agent
    intent_summary: The CapabilityKit skill guide and installer references cover
      agent entrypoint installation, managed-block preservation, human-authored
