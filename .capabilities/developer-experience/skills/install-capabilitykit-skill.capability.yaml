      - packages/cli/src/index.ts
      - packages/cli/tests/skillInstall.test.ts
    inferred_from: []
  verification:
    automated:
      - id: skill-install-tests
        description: Unit tests cover managed block append and replacement behavior.
        command: npm test
      - id: cli-build
        description: TypeScript build verifies the installer command and helper imports.
        command: npm run build
    manual:
      - Run capabilitykit skill in a sample project and confirm the generated
        files reference the package SKILL.md.
    gaps: []
    ignore_gaps: []
