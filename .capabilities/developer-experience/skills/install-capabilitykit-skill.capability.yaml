#
agent:
  # -----------------------------
  # machine managed agent metadata
  # refresh all review evidence: capabilitykit sync-review
  # refresh this review evidence: capabilitykit sync-review developer-experience/skills/install-capabilitykit-skill
  # review this capability: capabilitykit assess developer-experience/skills/install-capabilitykit-skill
  # ask an agent to review this capability: capabilitykit agent-review developer-experience/skills/install-capabilitykit-skill --command codex --handoff stdin
  # save agent review output: capabilitykit review-result developer-experience/skills/install-capabilitykit-skill --input review.json --save
  # -----------------------------
  inputs:
    - terminal command
    - existing AGENTS.md or CLAUDE.md files
    - package skill guide path
  outputs:
    - AGENTS.md managed CapabilityKit block
    - CLAUDE.md managed CapabilityKit block
    - .codex/skills/capabilitykit/SKILL.md wrapper
    - .claude/commands/capabilitykit.md slash command
  depends_on:
    - developer-experience/cli/cli-workflow
  implementation:
