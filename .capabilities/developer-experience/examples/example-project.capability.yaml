title: Example project
status: implemented
summary: Provide a small example app capability map for users to inspect.
intent: Show how product capabilities can be grouped by area and connected with
  dependencies.
acceptance:
  - Includes account and checkout capability areas.
  - Example files include agent.verification sections.
  - Example files are valid against the MVP schema.
guidance:
  - Keep examples realistic but compact.
  - Do not add app code that distracts from capability files.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # refresh all review evidence: capabilitykit sync-review
  # refresh this review evidence: capabilitykit sync-review developer-experience/examples/example-project
  # review this capability: capabilitykit assess developer-experience/examples/example-project
  # ask an agent to review this capability: capabilitykit agent-review developer-experience/examples/example-project --command codex --handoff stdin
  # save agent review output: capabilitykit review-result developer-experience/examples/example-project --input review.json --save
  # -----------------------------
  inputs:
    - examples/basic-app/.capabilities
  outputs:
    - example capability files
  depends_on:
    - core/model/define-capability-format
  implementation:
    references:
      - examples/basic-app/.capabilities/capabilitykit.yaml
      - examples/basic-app/.capabilities/account/login.capability.yaml
      - examples/basic-app/.capabilities/account/profile.capability.yaml
      - examples/basic-app/.capabilities/checkout/cart.capability.yaml
      - examples/basic-app/.capabilities/checkout/payment.capability.yaml
      - packages/core/tests/parser.test.ts
    inferred_from: []
  verification:
    automated:
      - id: parser-tests
        description: Unit tests load example capability shapes.
        command: npm test
    manual:
      - Read the example files and confirm they are understandable without extra
        docs.
    gaps: []
    ignore_gaps: []
  review:
    depth: verified
    source: coding-agent
    intent_summary: Coding-agent review confirmed the example app includes account
      and checkout capability areas, verification sections in example files, and
      parser tests that validate the example capability files against the
      schema.
    done: true
    criteria:
      - criterion: Includes account and checkout capability areas.
        status: covered
        evidence:
          - examples/basic-app/.capabilities/account/login.capability.yaml:4
          - examples/basic-app/.capabilities/checkout/payment.capability.yaml:4
          - packages/core/tests/parser.test.ts:99
      - criterion: Example files include agent.verification sections.
        status: covered
        evidence:
          - examples/basic-app/.capabilities/account/login.capability.yaml:20
          - examples/basic-app/.capabilities/checkout/payment.capability.yaml:21
          - packages/core/tests/parser.test.ts:110
      - criterion: Example files are valid against the MVP schema.
        status: covered
        evidence:
          - packages/core/tests/parser.test.ts:98
          - packages/core/tests/parser.test.ts:106
          - packages/core/tests/parser.test.ts:108
          - packages/core/tests/parser.test.ts:109
