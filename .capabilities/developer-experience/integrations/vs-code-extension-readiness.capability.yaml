title: VS Code extension readiness
status: planned
summary: Keep the package structure ready for a future VS Code extension without
  implementing it in the MVP.
intent: Preserve a path toward editor diagnostics, navigation, and capability
  tree views.
acceptance:
  - MVP does not include VS Code extension code.
  - Compiled JSON contains enough path and graph data for a future extension.
guidance:
  - Design output data to be editor-friendly.
  - Do not implement extension UI during the MVP.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review developer-experience/integrations/vs-code-extension-readiness
  # run deterministic review only: capabilitykit review developer-experience/integrations/vs-code-extension-readiness --deterministic-only
  # ask an agent and save review evidence: capabilitykit review developer-experience/integrations/vs-code-extension-readiness --agent codex --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result developer-experience/integrations/vs-code-extension-readiness --input review.json
  # -----------------------------
  inputs:
    - compiled capabilities JSON
  outputs:
    - future editor integration points
  depends_on:
    - core/graph/compile-capabilities
  verification:
    automated:
      - id: compile-tests
        description: Compile tests cover path and graph data needed by future tools.
        command: npm test
    manual:
      - Review compiled JSON and confirm it contains capability paths and
        dependencies.
  review:
    depth: partial
    source: coding-agent
    gaps:
      - MVP does not include VS Code extension code.
      - Compiled JSON contains enough path and graph data for a future extension.
    intent_summary: VS Code extension readiness is currently planned. I found no
      implementation references to inspect, so the acceptance criteria are not
      implemented yet.
    criteria:
      - criterion: MVP does not include VS Code extension code.
        status: uncovered
        notes: Capability status is planned and no agent.implementation.references are
          declared.
      - criterion: Compiled JSON contains enough path and graph data for a future
          extension.
        status: uncovered
        notes: Capability status is planned and no agent.implementation.references are
          declared.
    done: false
