title: YouTube demo and core concepts
status: implemented
summary: Provide a YouTube demo script and website explanation that connect
  CapabilityKit's core concepts to repo-native requirements, verification,
  impact, PR review, and story mapping.
intent: Help new users quickly understand why CapabilityKit exists and how its
  workflow replaces disconnected requirements tracking with capabilities that
  live near code and can be reviewed against implementation evidence.
acceptance:
  - Demo script explains the problem with requirements living outside the repo.
  - Demo script walks through capability files, status, diff, assessment,
    impact, and story-map views.
  - Demo script includes concrete terminal commands that can be run from this
    repository.
  - Website explains that a capability is a version-controlled behavior contract
    close to the code.
  - Website explains how acceptance, implementation references, verification,
    impact, and PR review fit together.
  - Website connects story mapping to progressive capability slices and
    retesting instead of presenting it as a separate planning artifact.
guidance:
  - Keep the language practical and developer-facing.
  - Avoid positioning CapabilityKit as a Jira clone or heavyweight process.
  - Make the website explanation skimmable before the generated viewers.
planning:
  story_map:
    backbone: Project communication
    step: Explain core concepts
    release: website
    order: 30
