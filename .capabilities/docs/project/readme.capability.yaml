id: docs/project/readme
title: README
status: implemented
area: docs
summary: Explain CapabilityKit as a developer review loop for capability diffs,
  implementation coverage, dependency impact, verification gaps, and dogfooding.
intent: Make the project understandable enough for a developer to review
  AI-assisted changes by capability intent, implementation evidence, and
  downstream impact.
acceptance:
  - README says CapabilityKit helps developers review what changed in product
    behavior, not only what changed in code.
  - README includes install instructions and a developer review loop with
    status, diff, assess, and impact commands.
  - README explains how verification reduces manual review bottlenecks.
  - README includes Organizing Capabilities guidance for easier maintenance.
  - README explains why planning documents can diverge from implementation
    after AI-assisted coding.
  - README explains capability diff, implementation coverage assessment, and
    dependency impact workflows.
  - README links to the generated SVG dependency graph and explains how to
    regenerate it.
  - Website shows the hierarchical nature of the .capabilities folder.
  - Website shows the main human-authored parts of a capability without the
    agent section.
guidance:
  - Keep the docs CLI-first and repo-native.
  - Do not position the MVP as a cloud product.
agent:
  inputs:
    - README.md
    - website/index.html
    - website/styles.css
  outputs:
    - project overview
    - developer review loop
    - CLI command reference
  depends_on:
    - docs/reference/capability-format-documentation
  implementation:
    references:
      - README.md
      - website/index.html
      - website/styles.css
  verification:
    automated:
      - id: dogfood-validate
        description: README capability is validated with the rest of the capability map.
        command: npm run capabilitykit -- validate
    manual:
      - Read README and confirm it avoids heavyweight methodology language.
