title: README
status: implemented
summary: Explain CapabilityKit as a developer review loop for capability diffs,
  implementation coverage, dependency impact, verification gaps, and dogfooding.
intent: Make the project understandable enough for a developer to review
  AI-assisted changes by capability intent, implementation evidence, and
  downstream impact.
acceptance:
  - README says CapabilityKit helps developers review what changed in product
    behavior, not only what changed in code.
  - README includes install instructions and a developer review loop with
    status, diff, assess, and impact commands.
  - README explains how verification reduces manual review bottlenecks.
  - README includes Organizing Capabilities guidance for easier maintenance.
  - README explains why planning documents can diverge from implementation after
    AI-assisted coding.
  - README explains capability diff, implementation coverage assessment, and
    dependency impact workflows.
  - README explains the dependency viewer, its SVG fallback, and how to
    regenerate both locally.
  - Website embeds the published HTML dependency viewer and links to the full
    viewer and SVG graph.
  - Website links to the published story-map viewer.
  - Website shows the hierarchical nature of the .capabilities folder.
  - Website shows the main human-authored parts of a capability without the
    agent section.
guidance:
  - Keep the docs CLI-first and repo-native.
  - Do not position the MVP as a cloud product.
planning:
  story_map:
    backbone: Website
    step: Publish project website
    release: website
    order: 10
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review docs/project/readme
  # run deterministic review only: capabilitykit review docs/project/readme --deterministic-only
  # ask an agent and save review evidence: capabilitykit review docs/project/readme --agent codex --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result docs/project/readme --input review.json
  # -----------------------------
  inputs:
    - README.md
    - website/index.html
    - website/styles.css
    - .github/workflows/deploy-website.yml
    - website/story-map-viewer.html
  outputs:
    - project overview
    - developer review loop
    - CLI command reference
  depends_on:
    - docs/reference/capability-format-documentation
  implementation:
    references:
      - README.md
      - website/index.html
      - website/styles.css
      - .github/workflows/deploy-website.yml
      - website/story-map-viewer.html
  verification:
    automated:
      - id: dogfood-validate
        description: README capability is validated with the rest of the capability map.
        command: npm run capabilitykit -- validate
    manual:
      - Read README and confirm it avoids heavyweight methodology language.
  review:
    depth: verified
    source: coding-agent
    intent_summary: Coding-agent review confirmed README and website documentation
      explain behavior-focused review, install and CLI loops, verification
      depth, organization, drift after AI coding, dependency viewer publishing,
      home-page embedding, and website capability structure examples.
