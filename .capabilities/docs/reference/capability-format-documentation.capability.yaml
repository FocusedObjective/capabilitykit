title: Capability format documentation
status: implemented
summary: Document the capability YAML fields and verification gap model.
intent: Help developers write useful specs without treating CapabilityKit as
  heavyweight process.
acceptance:
  - README explains what a capability is.
  - README includes an example capability file.
  - README explains verification gaps.
  - README explains how folder hierarchy and capability IDs should align.
guidance:
  - Use practical developer language.
  - Avoid UML, enterprise architecture, and governance-heavy framing.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # refresh all review evidence: capabilitykit sync-review
  # refresh this review evidence: capabilitykit sync-review docs/reference/capability-format-documentation
  # review this capability: capabilitykit assess docs/reference/capability-format-documentation
  # ask an agent to review this capability: capabilitykit agent-review docs/reference/capability-format-documentation --command codex --handoff stdin
  # save agent review output: capabilitykit review-result docs/reference/capability-format-documentation --input review.json --save
  # -----------------------------
  inputs:
    - README.md
    - .capabilities/**/*.capability.yaml
  outputs:
    - documented capability format
  depends_on:
    - core/model/define-capability-format
  implementation:
    references:
      - README.md
    inferred_from: []
  verification:
    automated:
      - id: dogfood-validate
        description: The docs capability is validated as part of the project capability map.
        command: npm run capabilitykit -- validate
    manual:
      - Read README from a new user's perspective and confirm the format is
        clear.
    gaps: []
    ignore_gaps: []
  review:
    depth: verified
    source: coding-agent
    intent_summary: Coding-agent review confirmed the README documents what
      capabilities are, shows a YAML example, explains verification gaps, and
      describes the file path to capability ID hierarchy convention.
    done: true
    criteria:
      - criterion: README explains what a capability is.
        status: covered
        evidence:
          - README.md:49
          - README.md:51
          - README.md:85
      - criterion: README includes an example capability file.
        status: covered
        evidence:
          - README.md:53
          - README.md:54
          - README.md:83
      - criterion: README explains verification gaps.
        status: covered
        evidence:
          - README.md:195
          - README.md:197
          - README.md:201
          - README.md:203
      - criterion: README explains how folder hierarchy and capability IDs should align.
        status: covered
        evidence:
          - README.md:179
          - README.md:181
          - README.md:183
          - README.md:193
