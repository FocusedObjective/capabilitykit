id: docs/readme
title: README
status: implemented
area: docs
summary: Explain CapabilityKit, quick start, CLI commands, verification gaps,
  and dogfooding.
intent: Make the project understandable enough for a developer to try locally.
acceptance:
  - README states the product thesis clearly.
  - README includes install and quick start instructions.
  - README explains how verification reduces manual review bottlenecks.
guidance:
  - Keep the docs CLI-first and repo-native.
  - Do not position the MVP as a cloud product.
agent:
  inputs:
    - README.md
  outputs:
    - project overview
    - quick start
    - CLI command reference
  depends_on:
    - docs/capability-format-documentation
  implementation:
    references:
      - README.md
  verification:
    automated:
      - id: dogfood-validate
        description: README capability is validated with the rest of the capability map.
        command: npm run capabilitykit -- validate
    manual:
      - Read README and confirm it avoids heavyweight methodology language.
