title: Review capability with agent
status: implemented
summary: Ask an external agent to compare a capability's declared intent and
  acceptance criteria against implementation evidence.
intent: Help maintainers decide whether implementation is done by producing
  structured evidence for each acceptance criterion without blindly trusting an
  AI judgment.
acceptance:
  - Generates a review-mode task bundle for one capability.
  - Asks the agent to summarize intent in its own words before judging coverage.
  - Asks the agent to mark each acceptance criterion covered, partial,
    uncovered, or uncertain.
  - Requires file-path evidence for covered or partially covered criteria.
  - Provides a review command that saves valid coding-agent review evidence by
    default and supports no-save or dry-run previews.
  - Keeps status changes policy-controlled and does not automatically mark a
    capability verified solely from agent prose.
guidance:
  - Treat agent review as evidence for human or policy-controlled acceptance.
  - Prefer structured JSON output for criterion status and evidence.
  - Reuse the deterministic implementation coverage report when available.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/agents/review-capability-with-agent
  # run deterministic review only: capabilitykit review core/agents/review-capability-with-agent --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/agents/review-capability-with-agent --agent codex --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/agents/review-capability-with-agent --input review.json
  # -----------------------------
  inputs:
    - capability summary and intent
    - acceptance criteria
    - implementation reference files
    - verification checks
  outputs:
    - structured acceptance coverage review
    - unresolved gaps or uncertain criteria
  depends_on:
    - core/agents/prepare-agent-task-bundle
    - core/assessment/assess-implementation-coverage
  implementation:
    references:
      - packages/core/src/agentReview.ts
      - packages/core/src/agentTask.ts
      - packages/core/src/assessImplementationCoverage.ts
      - packages/core/src/externalAgent.ts
      - packages/core/src/index.ts
      - packages/cli/src/index.ts
      - packages/core/tests/agentReview.test.ts
  verification:
    automated:
      - id: agent-review-prompt-tests
        description: Unit tests confirm review bundles request structured
          criterion-level evidence.
        command: npm test -- packages/core/tests/agentReview.test.ts
      - id: dogfood-agent-review-dry-run
        description: The CLI prepares a Codex review handoff without executing the agent.
        command: node packages/cli/dist/index.js review
          core/agents/review-capability-with-agent --agent codex --arg exec
          --handoff stdin --dry-run --no-references
    manual:
      - Run a review bundle through Codex or Claude Code and confirm the output
        is usable as acceptance evidence.
    gaps:
      - Capability status updates from review output need an explicit project
        policy before automation.
  review:
    depth: verified
    source: coding-agent
    intent_summary: Agent review prompt generation is implemented and intentionally
      policy-safe. It builds a review-mode bundle, asks for intent and
      criterion-level coverage, requires evidence, and records review as
      evidence rather than auto-verifying capability status.
    criteria:
      - criterion: Generates a review-mode task bundle for one capability.
        status: covered
        evidence:
          - packages/core/src/agentReview.ts:46
          - packages/core/src/agentReview.ts:51
          - packages/core/src/agentReview.ts:52
          - packages/core/src/agentReview.ts:59
          - packages/core/tests/agentReview.test.ts:66
        notes: buildAgentReviewPrompt delegates to buildAgentTaskBundle with mode review
          and returns the generated prompt.
      - criterion: Asks the agent to summarize intent in its own words before judging
          coverage.
        status: covered
        evidence:
          - packages/core/src/agentTask.ts:65
          - packages/core/src/agentTask.ts:67
          - packages/core/tests/agentTask.test.ts:66
        notes: Review-mode task instructions include the own-words intent summary
          requirement.
      - criterion: Asks the agent to mark each acceptance criterion covered, partial,
          uncovered, or uncertain.
        status: covered
        evidence:
          - packages/core/src/agentReview.ts:24
          - packages/core/src/agentReview.ts:26
          - packages/core/src/agentReview.ts:27
          - packages/core/src/agentTask.ts:68
          - packages/core/tests/agentReview.test.ts:70
        notes: The review JSON shape and review task instructions require criterion
          status values.
      - criterion: Requires file-path evidence for covered or partially covered criteria.
        status: covered
        evidence:
          - packages/core/src/agentReview.ts:28
          - packages/core/src/agentReview.ts:40
          - packages/core/src/agentTask.ts:69
          - packages/core/src/agentReviewResult.ts:138
        notes: Prompts ask for path evidence and review-result validation enforces
          evidence for covered and partial criteria.
      - criterion: Provides a review command that saves valid coding-agent review
          evidence by default and supports no-save or dry-run previews.
        status: covered
        evidence:
          - packages/cli/src/index.ts:1899
          - packages/cli/src/index.ts:1910
          - packages/cli/src/index.ts:1911
          - packages/cli/src/index.ts:2010
        notes: The review command saves valid agent output through saveAgentReviewResult
          by default, while --no-save and --dry-run avoid writes.
      - criterion: Keeps status changes policy-controlled and does not automatically
          mark a capability verified solely from agent prose.
        status: covered
        evidence:
          - packages/core/src/agentReview.ts:42
          - packages/core/src/agentReviewResult.ts:202
          - packages/core/tests/agentReviewResult.test.ts:123
          - packages/core/tests/agentReviewResult.test.ts:136
        notes: Review prompts say not to change capability status, and review-result
