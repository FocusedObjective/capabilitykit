title: Ingest agent review result
status: implemented
summary: Validate structured agent review output and optionally save it as
  capability review evidence.
intent: Turn external agent review prose into durable, policy-safe evidence
  without automatically changing capability status.
acceptance:
  - Parses the structured JSON output requested by agent-review prompts.
  - Validates reviewed criteria against the capability acceptance criteria.
  - Requires file-path evidence for criteria marked covered or partial.
  - Reports malformed review output, missing criteria, and missing evidence
    paths as validation issues.
  - Saves valid review evidence under agent.review without automatically
    changing capability status.
  - Saves review source and criterion-level evidence while omitting duplicate
    top-level evidence caches and empty review gaps.
guidance:
  - Keep ingestion separate from verification policy.
  - Do not mark a capability verified solely because an agent set done true.
  - Preserve enough criterion-level evidence for later human or automated policy
    review.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # refresh all review evidence: capabilitykit sync-review
  # refresh this review evidence: capabilitykit sync-review core/agents/ingest-agent-review-result
  # review this capability: capabilitykit assess core/agents/ingest-agent-review-result
  # ask an agent to review this capability: capabilitykit agent-review core/agents/ingest-agent-review-result --command codex --handoff stdin
  # save agent review output: capabilitykit review-result core/agents/ingest-agent-review-result --input review.json --save
  # -----------------------------
  inputs:
    - capability ID
    - structured agent review JSON output
    - capability acceptance criteria
    - review evidence paths
  outputs:
    - validated review result
    - agent.review criteria in the capability file
  depends_on:
    - core/agents/review-capability-with-agent
  implementation:
    references:
      - packages/core/src/agentReviewResult.ts
      - packages/core/src/schema.ts
      - packages/core/src/types.ts
      - packages/core/src/index.ts
      - packages/cli/src/index.ts
      - packages/core/tests/agentReviewResult.test.ts
    inferred_from: []
  verification:
    automated:
      - id: agent-review-result-tests
        description: Unit tests cover valid review ingestion, validation issues, and
          saving agent.review without status changes.
        command: npm test -- packages/core/tests/agentReviewResult.test.ts
      - id: cli-build
        description: TypeScript build verifies exported APIs and CLI integration.
        command: npm run build
    manual:
      - Run review-result with a saved agent-review JSON response and confirm
        the capability status is unchanged while agent.review is populated.
    gaps: []
    ignore_gaps: []
  review:
    depth: verified
    source: coding-agent
    intent_summary: Review-result ingestion is implemented. It parses structured
      JSON, validates criteria and evidence paths, saves source-tagged
      criterion-level review metadata, and does not mutate capability status.
    done: true
    criteria:
      - criterion: Parses the structured JSON output requested by agent-review prompts.
        status: covered
        evidence:
          - packages/core/src/agentReviewResult.ts:50
          - packages/core/src/agentReviewResult.ts:55
          - packages/core/src/agentReviewResult.ts:100
        notes: The parser accepts raw JSON or fenced JSON and validates it through the
          review result schema.
      - criterion: Validates reviewed criteria against the capability acceptance criteria.
        status: covered
        evidence:
          - packages/core/src/agentReviewResult.ts:108
          - packages/core/src/agentReviewResult.ts:110
          - packages/core/src/agentReviewResult.ts:117
          - packages/core/src/agentReviewResult.ts:129
        notes: Validation checks criterion count, missing expected criteria, and unknown
          criteria.
      - criterion: Requires file-path evidence for criteria marked covered or partial.
        status: covered
        evidence:
          - packages/core/src/agentReviewResult.ts:70
          - packages/core/src/agentReviewResult.ts:75
          - packages/core/src/agentReviewResult.ts:138
          - packages/core/src/agentReviewResult.ts:146
        notes: Covered and partial criteria require evidence, and each evidence path is
