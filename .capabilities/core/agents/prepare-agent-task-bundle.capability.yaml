title: Prepare agent task bundle
status: implemented
summary: Generate a deterministic prompt bundle for an external coding agent
  from one capability file.
intent: Let maintainers hand a capability's intent, acceptance criteria,
  guidance, verification checks, and referenced implementation context to tools
  such as Codex or Claude Code without depending on a specific editor.
acceptance:
  - Reads one capability by ID from the configured capability map.
  - Includes the capability title, status, summary, intent, acceptance criteria,
    guidance, dependencies, implementation references, and verification checks.
  - Supports implementation and review task modes.
  - Optionally includes the contents of existing implementation reference files.
  - Reports missing implementation reference files in the bundle instead of
    failing silently.
guidance:
  - Keep the bundle deterministic and useful before adding any autonomous agent
    loop.
  - Treat external agents as consumers of the bundle, not as a requirement for
    generating it.
  - Make the CLI usable from any terminal, CI job, or editor integration.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # refresh all review evidence: capabilitykit sync-review
  # refresh this review evidence: capabilitykit sync-review core/agents/prepare-agent-task-bundle
  # review this capability: capabilitykit assess core/agents/prepare-agent-task-bundle
  # ask an agent to review this capability: capabilitykit agent-review core/agents/prepare-agent-task-bundle --command codex --handoff stdin
  # save agent review output: capabilitykit review-result core/agents/prepare-agent-task-bundle --input review.json --save
  # -----------------------------
  inputs:
    - capability ID
    - .capabilities/**/*.capability.yaml
    - agent.implementation.references values
  outputs:
    - agent task prompt bundle
  depends_on:
    - core/graph/compile-capabilities
    - core/validation/verify-implementation-references
  implementation:
    references:
      - packages/core/src/agentTask.ts
      - packages/core/src/index.ts
      - packages/cli/src/index.ts
      - packages/core/tests/agentTask.test.ts
    inferred_from: []
  verification:
    automated:
      - id: agent-task-tests
        description: Unit tests verify task bundle content and missing reference handling.
        command: npm test -- packages/core/tests/agentTask.test.ts
      - id: dogfood-agent-task
        description: The CLI generates an implementation bundle for this capability.
        command: node packages/cli/dist/index.js agent-task
          core/agents/prepare-agent-task-bundle --mode implement
    manual:
      - Generate implement and review bundles and confirm they are clear enough
        to paste into an external coding agent.
    gaps: []
    ignore_gaps: []
  review:
    depth: partial
    gaps:
      - Reads one capability by ID from the configured capability map. Review
        the cited evidence. If it is correct, save agent.review evidence or make
        the criterion/reference wording more explicit.
      - Includes the capability title, status, summary, intent, acceptance
        criteria, guidance, dependencies, implementation references, and
        verification checks. Review the cited evidence. If it is correct, save
        agent.review evidence or make the criterion/reference wording more
        explicit.
      - Supports implementation and review task modes. Review the cited
        evidence. If it is correct, save agent.review evidence or make the
        criterion/reference wording more explicit.
      - Optionally includes the contents of existing implementation reference
        files. Review the cited evidence. If it is correct, save agent.review
        evidence or make the criterion/reference wording more explicit.
      - Reports missing implementation reference files in the bundle instead of
        failing silently. Review the cited evidence. If it is correct, save
