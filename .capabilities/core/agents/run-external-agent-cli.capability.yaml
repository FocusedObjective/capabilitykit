  # review this capability: capabilitykit assess core/agents/run-external-agent-cli
  # ask an agent to review this capability: capabilitykit agent-review core/agents/run-external-agent-cli --command codex --handoff stdin
  # save agent review output: capabilitykit review-result core/agents/run-external-agent-cli --input review.json --save
  # -----------------------------
