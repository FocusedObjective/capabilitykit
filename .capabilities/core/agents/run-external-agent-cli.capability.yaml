agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/agents/run-external-agent-cli
  # run deterministic review only: capabilitykit review core/agents/run-external-agent-cli --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/agents/run-external-agent-cli --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/agents/run-external-agent-cli --input review.json
  # -----------------------------
