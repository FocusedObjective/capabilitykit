title: Define capability format
status: implemented
summary: Define the YAML schema and TypeScript types for repo-native capability specs.
intent: Give humans and AI coding agents a shared source of intent, scope,
  acceptance criteria, and verification expectations.
acceptance:
  - Capability files require title, status, summary, intent, and acceptance
    criteria; area is derived from folder placement unless a custom override is
    explicitly retained.
  - Capability IDs can be omitted and derived from the capability file path.
  - Agent-maintained fields capture optional prompt context, dependencies,
    implementation references, verification, and criterion-level review
    evidence.
guidance:
  - Keep the MVP format small and deterministic.
  - Update this spec whenever the schema changes.
  - Do not make cloud services required for schema validation.
planning:
  story_map:
    backbone: Capability authoring
    step: Define capability model
    release: mvp
    order: 20
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/model/define-capability-format
  # run deterministic review only: capabilitykit review core/model/define-capability-format --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/model/define-capability-format --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/model/define-capability-format --input review.json
  # -----------------------------
  inputs:
    - .capabilities/**/*.capability.yaml
  outputs:
    - TypeScript schema
    - parsed capability objects
  implementation:
    references:
      - packages/core/src/schema.ts
      - packages/core/src/types.ts
      - packages/core/src/parseCapability.ts
  verification:
    automated:
      - id: parser-tests
        description: Unit tests cover valid and invalid capability parsing.
        command: npm test
    manual:
      - Review the example capability file in the README for clarity.
  review:
    depth: verified
    source: coding-agent
    intent_summary: The capability format is implemented in the Zod schema,
      TypeScript types, and parsing transform. Required human-authored fields,
      path-derived IDs and areas, explicit overrides, and agent metadata
      sections are represented.
    criteria:
      - criterion: Capability files require title, status, summary, intent, and
          acceptance criteria; area is derived from folder placement unless a
          custom override is explicitly retained.
        status: covered
