title: Refine discovered capabilities
status: implemented
summary: Provide an iterative review workflow that improves generated capability
  files after creation.
intent: Help teams turn agent-generated drafts into maintained capability specs
  by reviewing evidence, gaps, naming, and acceptance criteria over time.
acceptance:
  - Reports generated capabilities that still need human review.
  - Reuses assessment and review commands to compare each generated capability
    against implementation references.
  - Prioritizes refinement of capabilities with weak code evidence, shallow
    inspected path summaries, or mixed documentation evidence that may have
    influenced inferred acceptance criteria.
  - Suggests specific edits for vague acceptance criteria, weak references,
    missing verification, and poor area placement.
  - Reports accept, revise, or remove dispositions alongside the audit trail so
    users can choose a later explicit action for each generated draft.
  - Links recommendations back to the durable discovery report, including
    inspected paths, confidence notes, grouping decisions, and rejected or
    quarantined candidates.
  - Keeps refinement read-only and does not mutate generated status or review
    evidence, leaving subsequent updates to explicit user or policy actions.
guidance:
  - Treat generated capability files as the start of a maintenance loop, not a
    one-time import.
  - Ask agents to revisit code paths when the draft capability lacks concrete
    implementation evidence.
  - Keep recommendations grouped by the smallest useful edit.
  - Do not automatically promote generated capabilities to implemented or
    verified status from agent prose alone.
planning:
  story_map:
    backbone: Existing project discovery
    step: Refine generated map
    release: reverse-engineering
    order: 50
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/discovery/refine-discovered-capabilities
  # run deterministic review only: capabilitykit review core/discovery/refine-discovered-capabilities --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/discovery/refine-discovered-capabilities --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/discovery/refine-discovered-capabilities --input review.json
  # -----------------------------
  inputs:
    - generated capability files
    - durable discovery report
    - implementation references
    - inspected code path summaries
    - assessment output
    - agent review output
  outputs:
    - capability refinement recommendations
    - accepted review evidence
    - recommended explicit next actions
  depends_on:
    - core/discovery/generate-draft-capability-files
    - core/assessment/assess-implementation-coverage
    - core/agents/review-capability-with-agent
    - core/agents/ingest-agent-review-result
  implementation:
    references:
      - packages/core/src/discoveryRefinement.ts
      - packages/core/src/assessmentAdvice.ts
      - packages/core/src/index.ts
      - packages/cli/src/index.ts
      - packages/core/tests/discoveryRefinement.test.ts
  verification:
    automated:
      - id: discovery-refinement-tests
        description: Unit tests verify generated capabilities are surfaced with
          actionable refinement recommendations.
        command: npm test -- packages/core/tests/discoveryRefinement.test.ts
      - id: cli-build
        description: TypeScript build verifies refinement command integration.
        command: npm run build
    manual:
      - Run refinement against generated draft capabilities and confirm the
        recommendations help a maintainer improve the map without rereading the
        whole project.
    gaps:
      - Status promotion policy should remain configurable before any automated
        update workflow is enabled.
  review:
    depth: partial
    source: coding-agent
    gaps:
      - Add a persisted disposition workflow for accept, revise, and remove
        actions while retaining audit history.
      - Make discovered-draft status promotion configurable or require an
        explicit acceptance step before assigning implemented status.
      - Run the declared manual refinement workflow against a representative
        durable discovery report.
    evidence:
      - npm test -- packages/core/tests/discoveryRefinement.test.ts
      - npm run build
      - git diff --check
    intent_summary: Provide a read-only maintenance workflow that reviews generated
      capability drafts, recommends focused improvements, preserves discovery
      provenance, and leaves acceptance or status changes under explicit
