title: Prepare agent discovery bundle
status: planned
summary: Build a project-level prompt bundle that directs Codex, Claude Code,
  GitHub Copilot, or another coding agent to perform full code discovery before
  drafting capability files.
intent: Make CapabilityKit agent-neutral so users can choose the coding agent
  they already trust to interpret the project and create draft capability specs.
acceptance:
  - Generates a discovery-mode task bundle from the project inventory, existing
    capability map, and discovery goals.
  - Directs the external agent to inspect implementation code across the
    project's main entrypoints, user workflows, APIs, data models, tests,
    scripts, and configuration.
  - Instructs the external agent to create capability files for the main project
    functionality, not every implementation detail.
  - Instructs the external agent not to rely on README, package metadata, or
    filenames without confirming behavior in code.
  - Requires the agent to cite source evidence through
    `agent.implementation.references`.
  - Requires generated files to include verification gaps where behavior is
    inferred or not covered by tests.
  - Supports inspectable dry-run output before invoking an external agent.
guidance:
  - Reuse existing external-agent handoff conventions instead of creating a
    provider-specific integration first.
  - Keep the prompt explicit about folder structure, status policy, and evidence
    requirements.
  - Give the agent a discovery checklist and output contract instead of trying
    to precompute semantic capabilities from static metadata alone.
  - Make the bundle inspectable while allowing the external agent to navigate
    the project directly when its CLI supports workspace access.
#
#
