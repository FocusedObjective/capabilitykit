title: Prepare agent discovery bundle
status: implemented
summary: Build a project-level prompt bundle that directs Codex, Claude Code,
  GitHub Copilot, or another coding agent to perform full code discovery before
  drafting capability files.
intent: Make CapabilityKit agent-neutral so users can choose the coding agent
  they already trust to interpret the project and create draft capability specs.
acceptance:
  - Generates a discovery-mode task bundle from the project inventory, existing
    capability map, and discovery goals.
  - Directs the external agent to inspect implementation code across the
    project's main entrypoints, user workflows, APIs, data models, tests,
    scripts, and configuration.
  - Instructs the external agent to propose structured capability candidates for
    the main project functionality, not every implementation detail.
  - Instructs the external agent to split broad discoveries into smaller
    independently reviewable capabilities when the code exposes separable
    workflows, commands, screens, API operations, or state transitions.
  - Instructs the external agent to use shared product-domain or workflow area
    hints so generated files group related capabilities under reusable folders
    instead of creating one folder per capability.
  - Requires first-pass dependency suggestions and source-backed acceptance
    evidence in the discovery output when implementation evidence supports them.
  - Instructs the external agent not to rely on README, package metadata, or
    filenames without confirming behavior in code.
  - Requires the agent to cite source evidence through
    `agent.implementation.references`.
  - Requires candidate proposals to include verification gaps where behavior is
    inferred or not covered by tests.
  - Instructs the external agent not to create, overwrite, or move capability
    files while performing discovery.
  - Supports inspectable dry-run output before invoking an external agent.
guidance:
  - Reuse existing external-agent handoff conventions instead of creating a
    provider-specific integration first.
  - Keep the prompt explicit about folder structure, status policy, and evidence
    requirements.
  - Give the agent a discovery checklist and output contract instead of trying
    to precompute semantic capabilities from static metadata alone.
  - Make the bundle inspectable while allowing the external agent to navigate
    the project directly when its CLI supports workspace access.
planning:
  story_map:
    backbone: Existing project discovery
    step: Prepare discovery context
    release: reverse-engineering
    order: 10
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/discovery/prepare-agent-discovery-bundle
  # run deterministic review only: capabilitykit review core/discovery/prepare-agent-discovery-bundle --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/discovery/prepare-agent-discovery-bundle --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/discovery/prepare-agent-discovery-bundle --input review.json
  # -----------------------------
  inputs:
    - project inventory
    - existing capability map
    - discovery goals
    - agent command configuration
    - source tree access instructions
  outputs:
    - discovery prompt bundle
    - optional external agent transcript
  depends_on:
    - core/agents/run-external-agent-cli
  implementation:
    references:
      - packages/core/src/discoveryAgentTask.ts
      - packages/core/src/index.ts
      - packages/cli/src/index.ts
      - packages/core/tests/discoveryAgentTask.test.ts
  verification:
    automated:
      - id: discovery-agent-bundle-tests
        description: Unit tests verify the discovery bundle includes full-code
          inspection instructions, evidence requirements, status policy, and
          output instructions.
        command: npm test -- packages/core/tests/discoveryAgentTask.test.ts
      - id: cli-build
        description: TypeScript build verifies discovery agent command wiring.
        command: npm run build
    manual:
      - Run a dry-run discovery handoff for Codex and Claude Code command
        configurations and confirm the generated prompt tells the agent to
        inspect source behavior instead of summarizing docs.
    gaps:
      - Provider-specific command defaults can be added later after the generic
        handoff is proven.
  review:
    depth: tested
    source: coding-agent
    gaps:
      - Claude Code was not installed locally, so its dry-run used an executable
        override.
      - "`discovery-run --dry-run` still requires a detectable executable;
        command-independent inspection is available through `discovery-task`."
      - There is no CLI-specific automated test for `discovery-task` or
        `discovery-run`; the built CLI paths were checked manually.
    evidence:
      - "Passed: npm test -- packages/core/tests/discoveryAgentTask.test.ts"
      - "Passed: npm test -- packages/core/tests/externalAgent.test.ts"
      - "Passed: npm run build"
