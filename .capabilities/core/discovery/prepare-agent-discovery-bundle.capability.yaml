  # review this capability: capabilitykit assess core/discovery/prepare-agent-discovery-bundle
  # ask an agent to review this capability: capabilitykit agent-review core/discovery/prepare-agent-discovery-bundle --command codex --handoff stdin
  # save agent review output: capabilitykit review-result core/discovery/prepare-agent-discovery-bundle --input review.json --save
  # -----------------------------
