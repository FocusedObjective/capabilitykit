title: Organize discovered capability map
status: planned
summary: Create a readable folder and dependency structure from agent-discovered
  capabilities so users can browse what the app currently does.
intent: Make the generated `.capabilities/` tree feel like a product map rather
  than a dump of source-code observations.
acceptance:
  - Groups agent-generated capabilities into meaningful area and subarea folders.
  - Suggests capability IDs and filenames that are stable, readable, and aligned
    with the generated folder structure.
  - Detects likely dependencies between discovered capabilities when code
    evidence or workflow relationships support them.
  - Provides a summary index of generated areas and top-level capabilities.
  - Flags ambiguous grouping decisions for human review instead of hiding them.
guidance:
  - Prefer product domains, workflows, and user-visible features over framework
    folders when naming areas.
  - Preserve the agent's inspected code evidence when moving or regrouping
    generated capabilities.
  - Keep dependency inference conservative.
  - Avoid creating deep folder trees unless the project has enough behavior to
    justify them.
planning:
  story_map:
    backbone: Existing project discovery
    step: Draft capability map
    release: reverse-engineering
    order: 20
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/discovery/organize-discovered-capability-map
  # run deterministic review only: capabilitykit review core/discovery/organize-discovered-capability-map --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/discovery/organize-discovered-capability-map --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/discovery/organize-discovered-capability-map --input review.json
  # -----------------------------
  inputs:
    - discovery candidates
    - generated capability files
    - inspected code path summary
    - existing capability IDs
  outputs:
    - organized .capabilities folder structure
    - dependency suggestions
    - generated capability index summary
  depends_on:
    - core/discovery/generate-draft-capability-files
    - core/graph/compile-capabilities
    - core/graph/analyze-capability-impact
  verification:
    automated:
      - id: capability-map-organization-tests
        description: Unit tests verify stable ID, folder, and dependency suggestions for
          fixture projects.
        command: npm test -- packages/core/tests/discoveryOrganization.test.ts
      - id: generated-map-compiles
        description: Generated capability maps compile after organization.
        command: npm run build
    manual:
      - Review generated folders for a sample app and confirm a maintainer can
        answer what the app does without reading source code first.
    gaps:
      - Dependency inference may need project-specific review for cross-cutting
        infrastructure and shared services.
