title: Generate draft capability files
status: implemented
summary: Turn agent-discovered project capabilities into draft
  `.capability.yaml` files with implementation references and explicit
  verification gaps.
intent: Let a user ask their agent of choice to create a useful first
  `.capabilities/` map for the main functionality of an existing application.
acceptance:
  - Converts an explicitly selected organized generation plan into valid
    capability files.
  - Writes files under a neat area and subfolder structure that reflects the
    application's domains and workflows.
  - Populates title, status, summary, intent, acceptance criteria, and
    verification gaps while deriving capability IDs and areas from the selected
    folder paths, and includes implementation references for discovered existing
    behavior.
  - Requires every generated capability for discovered existing behavior to
    include concrete implementation references from code inspection, not only
    documentation or package metadata.
  - Uses implemented status for discovered existing behavior with concrete
    implementation references, uses planned only for explicitly retained
    proposals for absent behavior, and never claims generated files are
    verified.
  - Refuses to overwrite existing capability files unless force is requested.
  - Writes files only after the user explicitly requests generation and reports
    path collisions before applying changes.
  - Preserves a durable discovery report with the report ID, evidence,
    confidence notes, inspected paths, grouping decisions, and rejected or
    quarantined candidates.
guidance:
  - Generated capability files should be useful to navigate even before they are
    perfect.
  - Prefer capability IDs that describe product behavior rather than internal
    module names.
  - Preserve evidence paths so maintainers can quickly review why each
    capability was proposed.
  - Reject or quarantine candidates that lack enough code evidence to be useful
    as draft capabilities.
planning:
  story_map:
    backbone: Existing project discovery
    step: Generate capability files
    release: reverse-engineering
    order: 40
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/discovery/generate-draft-capability-files
  # run deterministic review only: capabilitykit review core/discovery/generate-draft-capability-files --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/discovery/generate-draft-capability-files --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/discovery/generate-draft-capability-files --input review.json
  # -----------------------------
  inputs:
    - capability discovery report
    - selected organized generation plan
    - existing .capabilities folder
  outputs:
    - .capabilities/**/*.capability.yaml
    - generation summary
    - durable discovery report
  depends_on:
    - core/discovery/organize-discovered-capability-map
    - core/validation/validate-capability-files
    - core/validation/verify-implementation-references
  implementation:
    references:
      - packages/core/src/discoveryGeneration.ts
      - packages/core/src/discoveryOrganization.ts
      - packages/core/src/discoveryReport.ts
      - packages/core/src/index.ts
      - packages/cli/src/index.ts
      - packages/core/tests/discoveryGeneration.test.ts
  verification:
    automated:
      - id: generated-capability-validation-tests
        description: Unit tests verify generated draft files parse and validate.
        command: npm test -- packages/core/tests/discoveryGeneration.test.ts
      - id: cli-build
        description: TypeScript build verifies generation APIs and CLI options.
        command: npm run build
    manual:
      - Generate draft capabilities in a fixture project and confirm the
        resulting folder structure is understandable to a new maintainer.
    gaps:
      - Generated acceptance criteria still need review because source evidence
        cannot fully explain product intent.
  review:
    depth: tested
    source: coding-agent
    gaps:
      - Generated acceptance criteria still require human review because source
        evidence cannot fully establish product intent.
      - The declared manual readability check for a generated fixture map was
        not performed.
    evidence:
      - "npm test -- packages/core/tests/discoveryGeneration.test.ts: passed, 7
        tests"
      - "npm test -- packages/core/tests/discovery.test.ts
        packages/core/tests/discoveryOrganization.test.ts
        packages/core/tests/discoveryGeneration.test.ts: passed, 14 tests"
      - "npm run build: passed for @capabilitykit/core and @capabilitykit/cli"
    intent_summary: Generate an inspectable first-pass .capabilities map from a
      selected discovery plan. Drafts preserve code evidence and explicit gaps,
