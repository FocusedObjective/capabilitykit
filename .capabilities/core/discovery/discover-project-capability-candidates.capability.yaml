title: Discover project capability candidates
status: implemented
summary: Add a CLI command that asks a coding agent to investigate an installed
  project's full codebase and propose the first draft of what the app currently
  does.
intent: Give users a practical starting point after installing CapabilityKit in
  an existing project, without requiring them to author every capability file
  from a blank page.
acceptance:
  - Provides a CLI command that runs from the target project root.
  - Invokes or prepares a handoff for the user's selected coding agent to
    inspect source code, tests, routes, handlers, UI flows, data models,
    scripts, configuration, and documentation.
  - Makes README files, package metadata, and docs supporting context, not the
    sole or primary basis for capability discovery.
  - Requires the agent to propose candidate capability titles, likely areas,
    source evidence, and confidence notes from concrete code discovery.
  - Requires each candidate proposal to include a summary, inferred intent,
    acceptance criteria, implementation references, verification gaps, likely
    relationships, and inspected code paths.
  - Produces a structured discovery report that records what files and project
    areas the agent inspected.
  - Records durable discovery provenance, including the report ID, agent
    transcript when available, confidence notes, and rejected or quarantined
    candidates.
  - Separates explicitly retained absent-behavior proposals from code-backed
    discovered candidates so later generation can keep them planned.
  - Does not create or overwrite capability files unless the user explicitly
    requests output generation.
  - Labels low-confidence candidates, shallow inspection, and missing code
    evidence as review gaps.
guidance:
  - Treat discovery output as agent-authored draft product understanding, not as
    verified product truth.
  - The CLI should orchestrate discovery, constrain scope, and validate output;
    the coding agent should perform the semantic code investigation.
  - Keep the first version framework-aware where local file patterns and agent
    inspection make that useful.
  - Prefer small, navigable candidate groups over a flat list of every file or
    component.
planning:
  story_map:
    backbone: Existing project discovery
    step: Draft capability map
    release: reverse-engineering
    order: 20
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/discovery/discover-project-capability-candidates
  # run deterministic review only: capabilitykit review core/discovery/discover-project-capability-candidates --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/discovery/discover-project-capability-candidates --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/discovery/discover-project-capability-candidates --input review.json
  # -----------------------------
  inputs:
    - project root
    - source files
    - tests
    - routes and handlers
    - UI and workflow code
    - data models and persistence code
    - configuration and scripts
    - documentation
    - package and workspace metadata
    - selected coding agent command
  outputs:
    - capability discovery report
    - candidate capability metadata
    - source evidence references
    - inspected file and area summary
    - discovery provenance and quarantined candidates
    - explicitly retained absent-behavior proposals
  depends_on:
    - core/discovery/prepare-agent-discovery-bundle
    - core/project/initialize-capability-project
    - core/model/define-capability-format
    - core/agents/run-external-agent-cli
  implementation:
    references:
      - packages/core/src/discoveryReport.ts
      - packages/core/src/discoveryAgentTask.ts
      - packages/core/src/index.ts
      - packages/cli/src/index.ts
      - packages/core/tests/discovery.test.ts
      - packages/core/tests/discoveryAgentTask.test.ts
  verification:
    automated:
      - id: discovery-report-tests
        description: Unit tests cover discovery report parsing, required evidence
          fields, and shallow-inspection warnings.
        command: npm test -- packages/core/tests/discovery.test.ts
      - id: cli-build
        description: TypeScript build verifies the discovery command integration.
        command: npm run build
    manual:
      - Run the discovery command with Codex or Claude Code in a fixture project
        and confirm the agent inspects implementation files, not only README or
        package metadata, before proposing capabilities.
    gaps:
      - Initial agent discovery may miss behavior that is only visible through
        runtime state, production configuration, external services, or code
        paths outside the inspected scope.
  review:
    depth: tested
    source: coding-agent
    gaps:
      - Manual end-to-end verification with Codex or Claude Code against a
        fixture project was not run.
      - Discovery may still miss behavior visible only through runtime state,
        production configuration, external services, or uninspected paths.
    evidence:
      - npm test -- packages/core/tests/discovery.test.ts
        packages/core/tests/discoveryAgentTask.test.ts
        packages/core/tests/discoveryOrganization.test.ts
        packages/core/tests/discoveryGeneration.test.ts
        packages/core/tests/discoveryRefinement.test.ts (16 tests passed)
      - npm run build (core and CLI TypeScript builds passed)
