id: core/assess-implementation-coverage
title: Assess implementation coverage
status: implemented
area: core
summary: Compare a capability's acceptance criteria with its referenced
  implementation files to help determine whether the code covers the declared
  behavior.
intent: Move beyond checking that implementation paths exist by giving humans
  and agents a focused evidence bundle for capability review.
acceptance:
  - Reads the referenced implementation files for one capability.
  - Presents each acceptance criterion beside relevant implementation evidence.
  - Marks criteria as covered, uncovered, or uncertain.
  - Reports missing or unreadable references as uncovered evidence.
  - Keeps the first version deterministic or review-assisted rather than
    silently trusting an AI judgment.
guidance:
  - Start with a deterministic evidence report that loads capability details and
    referenced files.
  - Add an agentic or LLM review loop only after the report shape is useful and
    testable.
  - Do not mark capabilities verified solely because referenced files contain
    matching words.
agent:
  inputs:
    - capability acceptance criteria
    - capability agent.implementation.references values
    - referenced source and documentation files
  outputs:
    - implementation coverage report
    - uncovered or uncertain acceptance criteria
  depends_on:
    - core/verify-implementation-references
  implementation:
    references:
      - packages/core/src/assessImplementationCoverage.ts
      - packages/core/src/index.ts
      - packages/cli/src/index.ts
      - packages/core/tests/assessImplementationCoverage.test.ts
  verification:
    automated:
      - id: coverage-report-tests
        description: Unit tests cover report generation for covered, uncovered, and
          missing-reference cases.
        command: npm test -- packages/core/tests/assessImplementationCoverage.test.ts
      - id: dogfood-coverage-report
        description: The CLI reports implementation coverage for this capability.
        command: node packages/cli/dist/index.js assess core/assess-implementation-coverage
    manual:
      - Run the coverage report against core/verify-implementation-references
        and confirm the output gives a reviewer enough context to judge the
        implementation.
    gaps:
      - Deterministic text evidence can identify review targets but cannot prove
        semantic correctness without human or explicit AI review.
