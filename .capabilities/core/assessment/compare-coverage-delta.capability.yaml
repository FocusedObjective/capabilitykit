  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/assessment/compare-coverage-delta
  # run deterministic review only: capabilitykit review core/assessment/compare-coverage-delta --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/assessment/compare-coverage-delta --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/assessment/compare-coverage-delta --input review.json
  # -----------------------------
