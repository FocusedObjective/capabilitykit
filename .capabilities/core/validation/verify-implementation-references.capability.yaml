title: Verify implementation references
status: implemented
summary: Confirm implemented and verified capabilities point to
  agent.implementation.references values that exist in the repository.
intent: Help maintainers and agents trust that completed capabilities are tied
  to inspectable code or documentation.
acceptance:
  - Checks agent.implementation.references for capabilities marked implemented
    or verified.
  - Reports a verification gap when a referenced implementation path does not
    exist.
  - Does not report a gap for agent.implementation.references values that
    resolve under the project root.
guidance:
  - Treat missing reference targets as verification gaps so validation remains
    advisory by default.
  - Do not require planned capabilities to have agent.implementation.references.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # refresh all review evidence: capabilitykit sync-review
  # refresh this review evidence: capabilitykit sync-review core/validation/verify-implementation-references
  # review this capability: capabilitykit assess core/validation/verify-implementation-references
  # ask an agent to review this capability: capabilitykit agent-review core/validation/verify-implementation-references --command codex --handoff stdin
  # save agent review output: capabilitykit review-result core/validation/verify-implementation-references --input review.json --save
  # -----------------------------
  inputs:
    - .capabilities/**/*.capability.yaml
    - agent.implementation.references values
  outputs:
    - verification gap list
  depends_on:
    - core/validation/validate-capability-files
  implementation:
    references:
      - packages/core/src/validateCapabilities.ts
      - packages/core/tests/validation.test.ts
    inferred_from: []
  verification:
    automated:
      - id: implementation-reference-tests
        description: Unit tests cover existing and missing implementation reference targets.
        command: npm test
      - id: dogfood-validate
        description: The CLI validates CapabilityKit's own capability map and
          agent.implementation.references values.
        command: npm run capabilitykit -- validate
    manual:
      - Break one agent.implementation.references value locally and confirm
        validation reports the missing path.
    gaps: []
    ignore_gaps: []
  review:
    depth: partial
    gaps:
      - Checks agent.implementation.references for capabilities marked
        implemented or verified. Review the cited evidence. If it is correct,
        save agent.review evidence or make the criterion/reference wording more
        explicit.
      - Reports a verification gap when a referenced implementation path does
        not exist. Review the cited evidence. If it is correct, save
        agent.review evidence or make the criterion/reference wording more
        explicit.
      - Does not report a gap for agent.implementation.references values that
        resolve under the project root. Review the cited evidence. If it is
        correct, save agent.review evidence or make the criterion/reference
        wording more explicit.
