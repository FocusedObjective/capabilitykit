title: Validate capability files
status: implemented
summary: Validate schema correctness, duplicate IDs, broken dependencies, and
  verification gaps.
intent: Make changes safer by giving humans and agents a repeatable check before
  review.
acceptance:
  - Reports YAML and schema errors with file paths.
  - Detects duplicate capability IDs.
  - Detects broken agent.depends_on references.
  - Reports missing automated checks, missing manual review guidance, and
    missing agent.implementation.references values.
guidance:
  - Treat verification gaps as warnings by default.
  - Keep validation deterministic in the MVP.
  - Do not silently ignore malformed capability files.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # refresh all review evidence: capabilitykit sync-review
  # refresh this review evidence: capabilitykit sync-review core/validation/validate-capability-files
  # review this capability: capabilitykit assess core/validation/validate-capability-files
  # ask an agent to review this capability: capabilitykit agent-review core/validation/validate-capability-files --command codex --handoff stdin
  # save agent review output: capabilitykit review-result core/validation/validate-capability-files --input review.json --save
  # -----------------------------
  inputs:
    - .capabilities/**/*.capability.yaml
  outputs:
    - validation report
    - verification gap list
  depends_on:
    - core/model/define-capability-format
  implementation:
    references:
      - packages/core/src/parseCapability.ts
      - packages/core/src/schema.ts
      - packages/core/src/validateCapabilities.ts
      - packages/core/src/loadCapabilities.ts
      - packages/cli/src/index.ts
      - packages/core/tests/parser.test.ts
      - packages/core/tests/validation.test.ts
    inferred_from: []
  verification:
    automated:
      - id: validation-tests
        description: Unit tests cover duplicate IDs, broken dependencies, and
          verification gaps.
        command: npm test
      - id: dogfood-validate
        description: The CLI validates CapabilityKit's own capability map.
        command: npm run capabilitykit -- validate
    manual:
      - Confirm validation output is actionable enough to reduce manual review
        guesswork.
    gaps: []
    ignore_gaps: []
  review:
    depth: partial
    gaps:
      - Reports YAML and schema errors with file paths. Review the cited
        evidence. If it is correct, save agent.review evidence or make the
        criterion/reference wording more explicit.
      - Detects duplicate capability IDs. Review the cited evidence. If it is
        correct, save agent.review evidence or make the criterion/reference
        wording more explicit.
      - Detects broken agent.depends_on references. Review the cited evidence.
        If it is correct, save agent.review evidence or make the
        criterion/reference wording more explicit.
      - Reports missing automated checks, missing manual review guidance, and
