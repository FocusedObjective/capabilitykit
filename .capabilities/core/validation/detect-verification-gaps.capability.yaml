title: Detect verification gaps
status: implemented
summary: Identify missing or weak verification information in capability specs.
intent: Reduce the human bottleneck by making review needs explicit before
  maintainers inspect code manually.
acceptance:
  - Reports capabilities with no agent.verification.automated checks.
  - Reports capabilities with no agent.verification.manual review guidance.
  - Reports implemented or verified capabilities without
    agent.implementation.references values.
  - Reports declared agent.verification.gaps from capability files.
  - Allows capability files to suppress selected verification gap warnings with
    an explicit reason.
guidance:
  - Prefer specific gap messages tied to capability IDs.
  - Keep gap detection rules deterministic and covered by automated tests.
  - Do not use AI inference for MVP verification gap detection.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # refresh all review evidence: capabilitykit sync-review
  # refresh this review evidence: capabilitykit sync-review core/validation/detect-verification-gaps
  # review this capability: capabilitykit assess core/validation/detect-verification-gaps
  # ask an agent to review this capability: capabilitykit agent-review core/validation/detect-verification-gaps --command codex --handoff stdin
  # save agent review output: capabilitykit review-result core/validation/detect-verification-gaps --input review.json --save
  # -----------------------------
  inputs:
    - parsed capability objects
  outputs:
    - verification gap list
  depends_on:
    - core/model/define-capability-format
  implementation:
    references:
      - packages/core/src/validateCapabilities.ts
      - packages/core/src/schema.ts
      - packages/core/src/types.ts
      - packages/core/tests/validation.test.ts
    inferred_from: []
  verification:
    automated:
      - id: verification-gap-tests
        description: Unit tests cover deterministic verification gap detection.
        command: npm test
    manual:
      - Review validation output and confirm gaps explain what a human still
        needs to check.
    gaps: []
    ignore_gaps: []
  review:
    depth: verified
    source: coding-agent
    intent_summary: Coding-agent review confirmed validation reports missing
      automated/manual checks, missing implementation references, declared gaps,
      and explicit ignore-gaps suppression with tests covering the deterministic
      rules.
    done: true
    criteria:
      - criterion: Reports capabilities with no agent.verification.automated checks.
        status: covered
        evidence:
          - packages/core/src/validateCapabilities.ts:106
          - packages/core/src/validateCapabilities.ts:107
          - packages/core/tests/validation.test.ts:64
          - packages/core/tests/validation.test.ts:74
      - criterion: Reports capabilities with no agent.verification.manual review guidance.
        status: covered
        evidence:
          - packages/core/src/validateCapabilities.ts:110
          - packages/core/src/validateCapabilities.ts:111
          - packages/core/tests/validation.test.ts:64
          - packages/core/tests/validation.test.ts:75
      - criterion: Reports implemented or verified capabilities without
