id: core/validation/detect-verification-gaps
title: Detect verification gaps
status: implemented
area: core
summary: Identify missing or weak verification information in capability specs.
intent: Reduce the human bottleneck by making review needs explicit before
  maintainers inspect code manually.
acceptance:
  - Reports capabilities with no agent.verification.automated checks.
  - Reports capabilities with no agent.verification.manual review guidance.
  - Reports implemented or verified capabilities without
    agent.implementation.references values.
  - Reports declared agent.verification.gaps from capability files.
guidance:
  - Prefer specific gap messages tied to capability IDs.
  - Keep gap detection rules deterministic and covered by automated tests.
  - Do not use AI inference for MVP verification gap detection.
agent:
  inputs:
    - parsed capability objects
  outputs:
    - verification gap list
  depends_on:
    - core/model/define-capability-format
  implementation:
    references:
      - packages/core/src/validateCapabilities.ts
  verification:
    automated:
      - id: verification-gap-tests
        description: Unit tests cover deterministic verification gap detection.
        command: npm test
    manual:
      - Review validation output and confirm gaps explain what a human still
        needs to check.
