title: Initialize capability project
status: implemented
summary: Create a starter .capabilities folder with config and an example capability.
intent: Help teams adopt capabilities as code with a small, understandable first step.
acceptance:
  - Creates the root capability config file.
  - Creates a starter capability file.
  - Refuses to overwrite existing files unless force is requested.
  - Prints practical next steps.
guidance:
  - Generated files should pass capabilitykit validate.
  - Do not overwrite user capability files by default.
planning:
  story_map:
    backbone: Capability authoring
    step: Start a capability project
    release: mvp
    order: 10
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/project/initialize-capability-project
  # run deterministic review only: capabilitykit review core/project/initialize-capability-project --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/project/initialize-capability-project --agent codex --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/project/initialize-capability-project --input review.json
  # -----------------------------
  inputs:
    - current working directory
  outputs:
    - .capabilities/capabilitykit.yaml
    - .capabilities/example.capability.yaml
  depends_on:
    - core/model/define-capability-format
  implementation:
    references:
      - packages/cli/src/index.ts
  verification:
    automated:
      - id: cli-build
        description: The CLI builds successfully.
        command: npm run build
    manual:
      - Run capabilitykit init in a temporary folder and confirm starter files
        are valid.
  review:
    depth: verified
    source: coding-agent
    intent_summary: Coding-agent review confirmed the init command creates starter
      config and capability files, uses non-overwrite writes unless --force is
      supplied, and prints concrete follow-up commands.
    criteria:
      - criterion: Creates the root capability config file.
        status: covered
        evidence:
          - packages/cli/src/index.ts:640
          - packages/cli/src/index.ts:643
          - packages/cli/src/index.ts:664
      - criterion: Creates a starter capability file.
        status: covered
        evidence:
          - packages/cli/src/index.ts:59
          - packages/cli/src/index.ts:641
          - packages/cli/src/index.ts:665
      - criterion: Refuses to overwrite existing files unless force is requested.
        status: covered
        evidence:
          - packages/cli/src/index.ts:51
          - packages/cli/src/index.ts:52
          - packages/cli/src/index.ts:53
          - packages/cli/src/index.ts:637
