title: Analyze capability impact
status: implemented
summary: Report downstream capabilities that may need review or testing when a
  capability changes.
intent: Help maintainers and agents understand the blast radius of capability
  changes by traversing reverse dependency relationships and surfacing relevant
  verification guidance.
acceptance:
  - Builds direct and transitive dependent relationships from agent.depends_on.
  - Reports impacted capabilities for a selected capability.
  - Includes suggested automated checks from the selected and impacted
    capabilities.
  - Includes manual review guidance and verification gaps for the impacted set.
  - Exposes impact data through the compiled capability artifact and CLI.
guidance:
  - Keep the existing dependency_graph output backward-compatible.
  - Treat deeper folder hierarchy as navigation and ownership context, not as a
    replacement for explicit depends_on relationships.
planning:
  story_map:
    backbone: Capability map
    step: Understand delivery health
    release: mvp
    order: 50
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/graph/analyze-capability-impact
  # run deterministic review only: capabilitykit review core/graph/analyze-capability-impact --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/graph/analyze-capability-impact --agent codex --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/graph/analyze-capability-impact --input review.json
  # -----------------------------
  inputs:
    - .capabilities/**/*.capability.yaml
    - capability agent.depends_on values
  outputs:
    - impact report
    - compiled impact graph
  depends_on:
    - core/graph/compile-capabilities
    - core/validation/validate-capability-files
  implementation:
    references:
      - packages/core/src/capabilityImpact.ts
      - packages/core/src/compileCapabilities.ts
      - packages/core/src/index.ts
      - packages/cli/src/index.ts
      - packages/core/tests/capabilityImpact.test.ts
      - packages/core/tests/compile.test.ts
  verification:
    automated:
      - id: impact-tests
        description: Unit tests verify reverse and transitive impact analysis.
        command: npm test -- packages/core/tests/capabilityImpact.test.ts
          packages/core/tests/compile.test.ts
      - id: dogfood-impact
        description: The CLI reports impact for a core capability.
        command: npm run capabilitykit -- impact core/graph/compile-capabilities
    manual:
      - Change or inspect a foundational capability and confirm the impact
        report identifies direct and transitive dependents that need review.
  review:
    depth: verified
    source: coding-agent
    intent_summary: Coding-agent review confirmed impact analysis builds dependency,
      dependent, and transitive dependent graphs from agent.depends_on, reports
      selected capability impact, and carries verification guidance into core
      and CLI output.
    criteria:
      - criterion: Builds direct and transitive dependent relationships from
          agent.depends_on.
        status: covered
        evidence:
          - packages/core/src/capabilityImpact.ts:15
          - packages/core/src/capabilityImpact.ts:25
          - packages/core/src/capabilityImpact.ts:33
          - packages/core/tests/capabilityImpact.test.ts:45
      - criterion: Reports impacted capabilities for a selected capability.
        status: covered
        evidence:
          - packages/core/src/capabilityImpact.ts:68
          - packages/core/src/capabilityImpact.ts:81
          - packages/core/src/capabilityImpact.ts:91
          - packages/core/tests/capabilityImpact.test.ts:64
      - criterion: Includes suggested automated checks from the selected and impacted
          capabilities.
        status: covered
        evidence:
          - packages/core/src/capabilityImpact.ts:55
          - packages/core/src/capabilityImpact.ts:86
          - packages/core/src/capabilityImpact.ts:97
          - packages/core/src/capabilityImpact.ts:124
      - criterion: Includes manual review guidance and verification gaps for the
          impacted set.
        status: covered
        evidence:
