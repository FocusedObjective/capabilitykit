title: Generate dependency graph SVG
status: implemented
summary: Generate an interactive SVG visualization of the capability dependency
  graph from the current capability map.
intent: Help maintainers and agents understand capability structure, status,
  verification gaps, and dependency relationships at a glance.
acceptance:
  - Provides a `graph` CLI command that writes an SVG dependency graph.
  - Writes `.capabilities/dependency-graph.svg` by default and supports a custom
    output path.
  - Supports generating a website-published SVG through the deploy workflow.
  - Updates compiled capability outputs before graph generation unless the user
    opts out.
  - Renders one node per capability with status, area, direct dependent count,
    and verification gap indicators.
  - Renders dependency links from `agent.depends_on` relationships.
  - Includes browser-side interaction for animated layout, dragging,
    highlighting, zoom, and spacing controls.
guidance:
  - Keep the SVG self-contained so users can open it directly in a browser.
  - Treat the visualization as a navigation and review aid, not as a replacement
    for `inspect`, `impact`, or validation output.
  - Preserve script-safe CLI behavior and return a non-zero exit code when
    validation fails.
