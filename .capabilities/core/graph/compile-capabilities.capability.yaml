title: Compile capabilities
status: implemented
summary: Compile capability YAML files into normalized JSON with validation and
  verification summary data.
intent: Provide a machine-readable capability map that tools and agents can
  consume consistently.
acceptance:
  - Writes normalized JSON to the configured output path.
  - Includes project metadata and all parsed capabilities.
  - Includes dependency graph information.
  - Includes validation results and verification summary.
guidance:
  - Include validation output in the compiled artifact so downstream tools can
    detect risk.
  - Do not emit partial JSON without surfacing validation failures.
agent:
  #
  #
  # -----------------------------
  # machine managed agent metadata
  # refresh this section with: capabilitykit sync-review <capability-id>
  # or save agent review output with: capabilitykit review-result <capability-id> --input review.json --save
  # -----------------------------
  inputs:
    - .capabilities/**/*.capability.yaml
  outputs:
    - configured compiled capability JSON output
  depends_on:
    - core/model/define-capability-format
    - core/validation/validate-capability-files
  implementation:
    references:
      - packages/core/src/compileCapabilities.ts
      - packages/cli/src/index.ts
      - packages/core/tests/compile.test.ts
    inferred_from: []
  verification:
    automated:
      - id: compile-tests
        description: Unit tests verify compiled output shape.
        command: npm test
      - id: dogfood-compile
        description: The CLI compiles CapabilityKit's own capability map.
        command: npm run capabilitykit -- compile
    manual:
      - Inspect the configured compiled JSON output after compile and confirm
        the graph is readable.
    gaps: []
    ignore_gaps: []
