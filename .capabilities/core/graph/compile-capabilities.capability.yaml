title: Compile capabilities
status: implemented
summary: Compile capability YAML files into normalized JSON with validation and
  verification summary data.
intent: Provide a machine-readable capability map that tools and agents can
  consume consistently.
acceptance:
  - Writes normalized JSON to the configured output path.
  - Includes project metadata and all parsed capabilities.
  - Includes dependency graph information.
  - Includes validation results and verification summary.
guidance:
  - Include validation output in the compiled artifact so downstream tools can
    detect risk.
  - Do not emit partial JSON without surfacing validation failures.
planning:
  story_map:
    backbone: Capability map
    step: Build capability map
    release: mvp
    order: 40
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/graph/compile-capabilities
  # run deterministic review only: capabilitykit review core/graph/compile-capabilities --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/graph/compile-capabilities --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/graph/compile-capabilities --input review.json
  # -----------------------------
  inputs:
    - .capabilities/**/*.capability.yaml
  outputs:
    - configured compiled capability JSON output
  depends_on:
    - core/model/define-capability-format
    - core/validation/validate-capability-files
  implementation:
    references:
      - packages/core/src/compileCapabilities.ts
      - packages/cli/src/index.ts
      - packages/core/tests/compile.test.ts
  verification:
    automated:
      - id: compile-tests
        description: Unit tests verify compiled output shape.
        command: npm test
      - id: dogfood-compile
        description: The CLI compiles CapabilityKit's own capability map.
        command: npm run capabilitykit -- compile
    manual:
      - Inspect the configured compiled JSON output after compile and confirm
        the graph is readable.
  review:
    depth: verified
    source: coding-agent
    intent_summary: Coding-agent review confirmed compile normalizes parsed
      capability files into JSON, writes to configured output, and includes
      metadata, dependency graph, validation, and verification summary data.
    criteria:
      - criterion: Writes normalized JSON to the configured output path.
        status: covered
        evidence:
          - packages/core/src/compileCapabilities.ts:33
          - packages/core/src/compileCapabilities.ts:36
          - packages/core/src/compileCapabilities.ts:38
          - packages/core/tests/compile.test.ts:43
      - criterion: Includes project metadata and all parsed capabilities.
        status: covered
        evidence:
          - packages/core/src/compileCapabilities.ts:12
          - packages/core/src/compileCapabilities.ts:18
          - packages/core/src/compileCapabilities.ts:21
          - packages/core/tests/compile.test.ts:12
      - criterion: Includes dependency graph information.
        status: covered
        evidence:
          - packages/core/src/compileCapabilities.ts:22
          - packages/core/src/compileCapabilities.ts:23
          - packages/core/tests/compile.test.ts:15
      - criterion: Includes validation results and verification summary.
        status: covered
        evidence:
