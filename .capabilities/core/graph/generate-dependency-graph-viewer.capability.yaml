        description: The CLI generates CapabilityKit's own graph viewer.
        command: npm run capabilitykit -- graph-viewer
    manual:
      - Open `.capabilities/dependency-viewer.html` in a browser, select scopes,
        click nodes, and confirm the side panel shows capability details.
