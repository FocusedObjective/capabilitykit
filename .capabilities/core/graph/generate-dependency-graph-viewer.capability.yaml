title: Generate dependency graph viewer
status: implemented
summary: Generate a fuller HTML dependency graph viewer with a capability
  details side panel while preserving the standalone SVG graph.
intent: Give maintainers a richer local inspection surface for capability
  structure, implementation evidence, verification gaps, review status, and
  dependency relationships without losing the portable SVG artifact.
acceptance:
  - Provides a graph-viewer CLI command that writes an HTML dependency graph
    viewer.
  - Keeps generating the standalone SVG graph alongside the HTML viewer.
  - Shows graph nodes and dependency links from the current capability map.
  - Shows suggested dependencies from discovery generation plans as dashed links
    that do not affect committed dependency impact analysis.
  - Lets users filter the graph by any capability folder scope.
  - Lets users click a node to pin capability details in a side panel.
  - Shows title, ID, status, scope, summary, intent, acceptance criteria,
    implementation references, verification checks, verification gaps, and
    agent.review details for the selected capability.
  - "Colors graph nodes and side-panel coverage badges by saved `agent.review`
    criterion coverage: green for fully covered verification, orange for partial
    coverage, and red for uncovered verification."
  - Highlights acceptance criteria in a shaded side-panel block with inline
    green covered, orange partially covered, and red not-covered icons.
  - Keeps detailed review evidence collapsed behind an expandable side-panel
    disclosure instead of duplicating review criteria as an always-visible
    section.
  - Shows dependencies and direct dependents for the selected capability.
  - Shows suggested dependencies for the selected capability when discovery
    generation plans recorded noncommitted dependency suggestions.
  - Provides a story-map dropdown that emphasizes matching graph nodes by
    story-map name while keeping nonmatching nodes visible but muted.
  - Keeps the viewer self-contained so it can be opened directly from the local
    filesystem.
guidance:
  - Keep the SVG as the small portable visualization.
  - Treat the HTML viewer as a richer inspector that can use normal HTML layout
    for details instead of forcing everything into SVG.
  - Reuse the same graph data model for SVG and HTML output where practical.
planning:
  story_map:
    backbone: CLI workflow
    step: Visualize capability relationships
    release: mvp
    order: 70
