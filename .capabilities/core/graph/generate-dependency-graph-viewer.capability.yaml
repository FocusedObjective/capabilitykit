  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review core/graph/generate-dependency-graph-viewer
  # run deterministic review only: capabilitykit review core/graph/generate-dependency-graph-viewer --deterministic-only
  # ask an agent and save review evidence: capabilitykit review core/graph/generate-dependency-graph-viewer --agent codex --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result core/graph/generate-dependency-graph-viewer --input review.json
