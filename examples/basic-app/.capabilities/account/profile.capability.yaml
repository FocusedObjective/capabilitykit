id: account/user-profile
title: User profile
status: planned
area: account
summary: Let users view and update basic profile information.
intent: Keep account data visible and editable after login.
acceptance:
  - Signed-in users can view profile details.
  - Signed-in users can update display name.
  - Anonymous users cannot access profile details.
guidance:
  - Treat account/user-login as a dependency for profile access.
  - Do not expose profile data to anonymous users.
agent:
  inputs:
    - authenticated session
  outputs:
    - updated profile
  depends_on:
    - account/user-login
  verification:
    automated:
      - id: profile-tests
        description: Profile tests cover access control and updates.
        command: npm test
    manual:
      - Review profile update behavior in the example app.
